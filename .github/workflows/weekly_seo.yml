name: Weekly Automated SEO & Meta Update

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  seo-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Auto SEO Keyword Discovery
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/auto_seo.py

      - name: Commit and Push SEO Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(seo): automated weekly keyword discovery & meta refresh [skip ci]"
          file_pattern: "index.html for-brands.html for-agencies.html sitemap.xml"
